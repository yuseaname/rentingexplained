{{ define "main" }}
<div class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
  {{ partial "breadcrumbs.html" . }}

  <header class="page-header mb-10">
    <span class="eyebrow">Search</span>
    <h1 class="page-title">Search guides and tools</h1>
    <p class="page-sub">Find answers across all of our renting guides, tools, and state law pages.</p>
  </header>

  <form class="search-form mb-8" role="search" id="search-form">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <label for="search-input" class="visually-hidden">Search</label>
    <input id="search-input" type="search" placeholder="e.g. security deposit, lease break, budget..." autocomplete="off">
  </form>

  <p id="search-status" class="text-sm text-muted mb-4"></p>
  <div id="search-results" class="space-y-4"></div>

  <div class="mt-12">
    <span class="eyebrow">Popular topics</span>
    <div class="flex flex-wrap gap-2 mt-3">
      <a href="/categories/apartment-hunting/" class="badge badge-neutral">Apartment Hunting</a>
      <a href="/categories/legal-rights/" class="badge badge-neutral">Legal Rights</a>
      <a href="/categories/costs/" class="badge badge-neutral">Costs</a>
      <a href="/tools/" class="badge badge-neutral">Tools</a>
      <a href="/state-laws/" class="badge badge-neutral">State Laws</a>
    </div>
  </div>
</div>

<script src="/search-index.json"></script>
<script>
(function() {
  var input = document.getElementById('search-input');
  var resultsEl = document.getElementById('search-results');
  var statusEl = document.getElementById('search-status');
  var index = [];

  function fetchIndex() {
    return fetch('/search-index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) { index = data || []; })
      .catch(function() { statusEl.textContent = 'Search index failed to load.'; });
  }

  function score(page, q) {
    var qlower = q.toLowerCase();
    var title = (page.title || '').toLowerCase();
    var desc = (page.description || '').toLowerCase();
    var content = (page.content || '').toLowerCase();
    var cats = (page.categories || []).join(' ').toLowerCase();
    var tags = (page.tags || []).join(' ').toLowerCase();

    if (title.indexOf(qlower) !== -1) return 5;
    if (cats.indexOf(qlower) !== -1) return 4;
    if (tags.indexOf(qlower) !== -1) return 3;
    if (desc.indexOf(qlower) !== -1) return 2;
    if (content.indexOf(qlower) !== -1) return 1;
    return 0;
  }

  function render(q) {
    if (!q) {
      resultsEl.innerHTML = '';
      statusEl.textContent = '';
      return;
    }
    var matches = index
      .map(function(p) { return { page: p, score: score(p, q) }; })
      .filter(function(x) { return x.score > 0; })
      .sort(function(a, b) { return b.score - a.score || a.page.title.localeCompare(b.page.title); })
      .slice(0, 10);

    statusEl.textContent = matches.length + ' result' + (matches.length === 1 ? '' : 's') + ' for "' + q + '"';

    resultsEl.innerHTML = matches.map(function(m) {
      var p = m.page;
      return '<a href="' + p.url + '" class="doorway-card">' +
        '<span class="doorway-card-title">' + (p.title || 'Untitled') + '</span>' +
        '<p class="doorway-card-desc">' + (p.description || '') + '</p>' +
      '</a>';
    }).join('');
  }

  input.addEventListener('input', function() { render(input.value.trim()); });

  fetchIndex();
})();
</script>
{{ end }}
