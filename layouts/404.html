{{ define "main" }}
<div class="page-404">
  <div class="max-w-lg mx-auto">
    <div class="mb-8 flex justify-center">
      <img src="/images/makeover/404-hero.webp" alt="Closed door with a key on the floor" class="max-w-xs rounded-2xl shadow-md">
    </div>
    <h1>404</h1>
    <p>Page not found</p>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center mt-8">
      <a href="{{ .Site.BaseURL | absURL }}" class="btn btn-primary">Back to Home</a>
      <a href="/start-here/" class="btn btn-ghost">Start Here</a>
      <a href="/search/" class="btn btn-ghost">Search</a>
    </div>
  </div>
</div>
{{ end }}
