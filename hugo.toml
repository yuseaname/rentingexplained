baseURL = 'https://rentingexplained.com/'
languageCode = 'en-us'
title = 'Renting Explained'
theme = 'adsense-base'

[params]
  # Central affiliate swap-point — change here, every Amazon link updates sitewide.
  amazon_tag = 'litwd-20'
  # Insurance affiliate swap-point — set the tracked URL here once approved; every CTA updates sitewide.
  insurance_affiliate_url = 'https://www.lemonade.com/renters'
  site_name = 'Renting Explained'
  description = 'Clear, practical guides for renters: know your rights, avoid hidden fees, and make smart housing decisions.'
  tagline = 'Renting, explained.'
  author = 'RentingExplained Editorial Team'
  favicon = '/favicon.ico'
  og_image = '/images/makeover/home-hero-v2.webp'
  google_site_verification = ''

  [params.adsense]
    client_id = 'ca-pub-5566942094411042'
    [params.adsense.slots]
      below_title = { id = '9770352885', format = 'auto', responsive = 'true' }
      mid_article = { id = '7429084400', format = 'auto', responsive = 'true' }
      end_article = { id = '3364726638', format = 'auto', responsive = 'true' }
      sidebar = { id = '3364726638', format = 'auto', responsive = 'false' }

  [params.rybbit]
    instance_url = 'https://app.rybbit.io'
    site_id = 'd00d1f463c4a'

[taxonomies]
  category = 'categories'
  tag = 'tags'

[permalinks]
  blog = '/blog/:slug'

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'SearchIndex']
  section = ['HTML', 'RSS']

[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Guides"
    url = "/blog"
    weight = 2
  [[menus.main]]
    name = "Tools"
    url = "/tools"
    weight = 3
  [[menus.main]]
    name = "Topics"
    url = "/categories/"
    weight = 4
  [[menus.main]]
    name = "About"
    url = "/about"
    weight = 5
  [[menus.main]]
    name = "Contact"
    url = "/contact"
    weight = 6

  [[menus.main]]
    name = "Search"
    url = "/search/"
    weight = 7

  [[menus.footer]]
    name = "Start Here"
    url = "/start-here/"
    weight = 5
  [[menus.footer]]
    name = "State Laws"
    url = "/state-laws/"
    weight = 6

  [[menus.footer]]
    name = "Privacy Policy"
    url = "/privacy-policy/"
    weight = 10
  [[menus.footer]]
    name = "Terms"
    url = "/terms-of-service/"
    weight = 20
  [[menus.footer]]
    name = "Disclosure"
    url = "/disclosure/"
    weight = 30
  [[menus.footer]]
    name = "Editorial Policy"
    url = "/editorial-policy/"
    weight = 40
  [[menus.footer]]
    name = "Corrections"
    url = "/corrections/"
    weight = 50
